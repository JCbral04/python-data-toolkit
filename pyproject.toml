[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-data-toolkit"
version = "1.0.0"
description = "A reusable Python library for data cleaning, anomaly detection, report generation, and SQL query analysis."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Juan Esteban Cabral Bautista", email = "juanescb30@outlook.com"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "tabulate>=0.9.0",
    "pyarrow>=15.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=7.1",
    "ruff>=0.6.0",
    "mypy>=1.13.0",
]

[project.urls]
Homepage = "https://github.com/JCbral04/python-data-toolkit"
Repository = "https://github.com/JCbral04/python-data-toolkit"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pdt*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[project.scripts]
pdt = "pdt.cli:cli"